name: documentation_builder
description: Generates documentation files that can import other files or Dart documentation comments.
version: 2.0.1
repository: https://github.com/domain-centric/documentation_builder
issue_tracker: https://github.com/domain-centric/documentation_builder/pulls
documentation: https://github.com/domain-centric/documentation_builder/wiki

environment:
  sdk: ^3.13.0

dependencies:
  build: ^5.0.0
  build_config: ^1.1.0
  collection: ^1.19.1
  fluent_regex: ^1.0.3
  http: ^1.2.0
  analyzer: ^14.6.0
  logging: ^1.0.2
  petitparser: ^7.0.1
  process_run: ^1.2.4
  resource_portable: ^3.1.2
  crypto: ^3.0.6
  glob: ^2.1.3
  package_config: ^3.0.0
  yaml_magic: ^1.0.6
  template_engine: ^2.0.1
  
dev_dependencies:
  lints: ^6.0.0
  test: ^1.21.6
  build_runner: ^2.2.1
  shouldly: ^0.5.0+1
  frontend_server_client: ^4.0.0

executables:
  documentation_builder: 

topics:
  - documentation
  - code-generation
  - markdown
  - dart
  - build-system